name: Capri Mac (Russian)

on:
  push:
    branches: [capri-mac]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capri-mac
  cancel-in-progress: false

jobs:
  ears:
    # her ears (Whisper), cross-compiled for Apple Silicon
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: |
          dotnet publish ears/CapriEars.csproj -c Release -r osx-arm64 --self-contained -o ears/out -p:DebugType=none -clp:ErrorsOnly
          find ears/out/runtimes -mindepth 1 -maxdepth 1 -type d ! -name macos-arm64 -exec rm -rf {} + || true
          ls -la ears/out | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: ears
          path: ears/out

  mac:
    # GitHub's Mac machines keep timing out in the queue: the app is put together on Linux, with her
    # Mac helper taken from the last build made on a Mac (it hasn't changed since; the VPN click has a
    # JavaScript fallback).
    needs: ears
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: ears
          path: ears/out
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -o pipefail
          mkdir -p logs prev
          chmod +x ears/out/CapriEars
          gh release download capri-mac-20261105-13 -p Capri-Mac-RU.zip -D prev
          (cd prev && unzip -q Capri-Mac-RU.zip)
          cp prev/Capri.app/Contents/Resources/app.asar.unpacked/src/main/mac/capri-helper src/main/mac/capri-helper
          chmod +x src/main/mac/capri-helper
          ls -la src/main/mac | tee logs/build.log
          # her hands: agent-desktop (vercel-labs, Apache-2.0), the Apple Silicon build
          mkdir -p hands/dl
          ( curl -fsSL --retry 3 -o hands/dl/ad.tar.gz https://github.com/vercel-labs/agent-desktop/releases/download/v1.2.0/agent-desktop-v1.2.0-aarch64-apple-darwin.tar.gz \
            && tar -xzf hands/dl/ad.tar.gz -C hands/dl \
            && find hands/dl -type f \( -name agent-desktop -o -name agent-desktop-macos-helper \) -exec cp {} hands/ \; ) 2>&1 | tee -a logs/build.log || echo "agent-desktop: not downloaded" | tee -a logs/build.log
          rm -rf hands/dl; chmod +x hands/* 2>/dev/null || true; ls -la hands | tee -a logs/build.log
          tag="capri-mac-$(date +%Y%m%d)-${{ github.run_number }}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          node -e "const f='package.json',p=require('./'+f);delete p.os;p.capriBuild='$tag';require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
          chmod +x mac/install.sh
          npm ci 2>&1 | tail -3 | tee -a logs/build.log
          npx electron-builder --mac dir --arm64 --publish never 2>&1 | tail -20 | tee -a logs/build.log
          ls dist | tee -a logs/build.log
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app=$(find dist -maxdepth 2 -name 'Capri.app' -type d | head -1)
          mkdir pack && cp -R "$app" pack/Capri.app && cp "Как установить.txt" pack/
          (cd pack && zip -qry ../Capri-Mac-RU.zip Capri.app "Как установить.txt")
          ls -la Capri-Mac-RU.zip | tee -a logs/build.log
          gh release create "$TAG" Capri-Mac-RU.zip --target capri-mac --latest --title "Капри для Mac по-русски — сборка ${{ github.run_number }}" --notes-file "Как установить.txt"
      - name: Share the logs
        if: always()
        run: |
          mkdir -p logs
          echo "${{ job.status }}" > logs/status.txt
          git config user.name "capri-build"
          git config user.email "capri-build@users.noreply.github.com"
          cp -R logs /tmp/logs
          git checkout --orphan build-log-mac
          git rm -rfq . >/dev/null
          rm -rf dist pack prev ears/out node_modules
          cp -R /tmp/logs/. .
          git add -A status.txt build.log
          git commit -qm "build ${{ github.run_number }}: ${{ job.status }}"
          git push -f origin build-log-mac
