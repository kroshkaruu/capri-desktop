name: Capri Mac (Russian)

on:
  push:
    branches: [capri-mac]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capri-mac
  cancel-in-progress: false

jobs:
  ears:
    # her ears (Whisper), cross-compiled for Apple Silicon
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: |
          dotnet publish ears/CapriEars.csproj -c Release -r osx-arm64 --self-contained -o ears/out -p:DebugType=none -clp:ErrorsOnly
          find ears/out/runtimes -mindepth 1 -maxdepth 1 -type d ! -name macos-arm64 -exec rm -rf {} + || true
          curl -sSL --retry 3 -o ears/out/ggml-large-v3-turbo-q5_0.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin
          ls -la ears/out | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: ears
          path: ears/out

  mac:
    needs: ears
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: ears
          path: ears/out
      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -o pipefail
          mkdir -p logs
          chmod +x ears/out/CapriEars
          node scripts/build-mac-helper.js 2>&1 | tee logs/build.log
          ls -la src/main/mac | tee -a logs/build.log
          npm ci 2>&1 | tail -3 | tee -a logs/build.log
          npx electron-builder --mac zip --arm64 --publish never 2>&1 | tail -30 | tee -a logs/build.log
          ls dist | tee -a logs/build.log
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls dist/*.zip | head -1)
          mkdir pack && (cd pack && ditto -x -k "../$zip" .)
          cp "Как установить.txt" pack/
          (cd pack && ditto -c -k --keepParent Capri.app ../Capri-Mac-RU.zip && zip -q ../Capri-Mac-RU.zip "Как установить.txt")
          tag="capri-mac-$(date +%Y%m%d)-${{ github.run_number }}"
          gh release create "$tag" Capri-Mac-RU.zip --target capri-mac --latest --title "Капри для Mac (порт CyberMoonie) по-русски — сборка ${{ github.run_number }}" --notes-file "Как установить.txt"
      - name: Share the logs
        if: always()
        run: |
          mkdir -p logs
          echo "${{ job.status }}" > logs/status.txt
          git config user.name "capri-build"
          git config user.email "capri-build@users.noreply.github.com"
          cp -R logs /tmp/logs
          git checkout --orphan build-log-mac
          git rm -rfq . >/dev/null
          rm -rf dist pack ears/out node_modules
          cp -R /tmp/logs/. .
          git add -A status.txt build.log
          git commit -qm "build ${{ github.run_number }}: ${{ job.status }}"
          git push -f origin build-log-mac
