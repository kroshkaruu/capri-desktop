name: Capri RU (Mac)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capri-ru
  cancel-in-progress: true

jobs:
  mac:
    # Built on Linux: the .NET part cross-compiles for Apple Silicon, and rcodesign signs it ad hoc.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        id: build
        run: |
          set -o pipefail
          mkdir -p logs
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' cross/Capri.Cross.csproj)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          dotnet publish cross/Capri.Cross.csproj -c Release -r osx-arm64 --self-contained -o out/arm64 -p:DebugType=none -clp:ErrorsOnly 2>&1 | tee logs/build.log
          echo "== files" >> logs/build.log
          (cd out/arm64 && find . -name '*.dylib' -o -name 'Capri' | sort) >> logs/build.log
      - name: Signing tool
        run: cargo install --locked apple-codesign >/dev/null 2>&1 || cargo install apple-codesign
      - name: Bundle
        run: |
          set -e
          version=${{ steps.build.outputs.version }}
          app=dist/Capri.app
          mkdir -p $app/Contents/MacOS $app/Contents/Resources
          cp -R out/arm64/. $app/Contents/MacOS/
          chmod +x $app/Contents/MacOS/Capri
          sed "s/@VERSION@/$version/g" cross/mac/Info.plist > $app/Contents/Info.plist
          pip install --quiet pillow
          python3 -c "from PIL import Image; Image.open('cross/icon.png').convert('RGBA').resize((1024,1024)).save('$app/Contents/Resources/Capri.icns')"
          curl -sSL --retry 3 -o $app/Contents/Resources/ggml-small-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
          ls -la $app/Contents/Resources >> logs/build.log
          rcodesign sign $app 2>&1 | tail -5 | tee -a logs/build.log
      - name: Package
        run: |
          set -e
          cp "cross/mac/Как установить.txt" "dist/Как установить.txt"
          (cd dist && zip -qry ../Capri-RU-mac.zip Capri.app "Как установить.txt")
          ls -la Capri-RU-mac.zip | tee -a logs/build.log
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ru-$(date +%Y%m%d)-${{ github.run_number }}"
          gh release create "$tag" Capri-RU-mac.zip --latest --title "Капри по-русски (сборка ${{ github.run_number }})" --notes-file "cross/mac/Как установить.txt"
      - name: Share the logs
        if: always()
        run: |
          mkdir -p logs
          echo "${{ job.status }}" > logs/status.txt
          git config user.name "capri-build"
          git config user.email "capri-build@users.noreply.github.com"
          cp -R logs /tmp/logs
          git checkout --orphan build-log
          git rm -rfq . >/dev/null
          rm -rf out dist Capri.iconset
          cp -R /tmp/logs/. .
          git add -A status.txt build.log
          git commit -qm "build ${{ github.run_number }}: ${{ job.status }}"
          git push -f origin build-log
