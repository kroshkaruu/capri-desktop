name: Probe
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: |
          git config user.name capri-build; git config user.email capri-build@users.noreply.github.com
          git checkout --orphan probe-log; git rm -rfq .; echo "ubuntu ok $(date)" > probe.txt; git add probe.txt; git commit -qm probe; git push -f origin probe-log
